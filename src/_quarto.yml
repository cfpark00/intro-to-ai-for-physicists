project:
  type: book
  output-dir: _site
  resources:
    - CNAME
    - assets/**

book:
  title: "Intro to AI for Physicists"
  favicon: assets/favicon.ico
  subtitle: "The science of deep learning, for physicists. Neural networks as model organisms — phenomena, methods, and the synthetic experiments that make them tractable."
  author:
    name: "Core Francisco Park"
    url: "https://corefranciscopark.com"
  date: today
  site-url: https://scienceofdl.com
  repo-url: https://github.com/cfpark00/science-of-dl
  repo-actions: [issue]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - chapters/01_intro.qmd
    - chapters/02_image_classification.qmd
    - chapters/03_sequence_modeling.qmd
    - chapters/04_transformers.qmd
    - chapters/05_llm_pretraining.qmd
    - chapters/06_llm_posttraining.qmd
    - chapters/07_scidl_training.qmd
    - chapters/08_diffusion.qmd
    - chapters/09_rl.qmd
    - chapters/10_world_models.qmd
    - chapters/11_scidl_concepts.qmd
    - chapters/12_intelligence.qmd
    - part: "Deep Dives"
      chapters:
        - deep_dives/systems.qmd
        - deep_dives/llm_architectures.qmd
        - deep_dives/data_centric.qmd
        - deep_dives/multimodal.qmd
        - deep_dives/interpretability.qmd
        - deep_dives/theory.qmd
        - deep_dives/bayesian_mcmc.qmd
        - deep_dives/classical_ml.qmd
        - deep_dives/neuroethology.qmd
        - deep_dives/neuroscience.qmd
        - deep_dives/cogsci.qmd
        - deep_dives/open_endedness.qmd
        - deep_dives/ai_for_science.qmd
        - deep_dives/ai_agents.qmd
        - deep_dives/mechanism_design.qmd
    - references.qmd
    - glossary.qmd

bibliography: references.bib

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    code-copy: true
    code-overflow: wrap
    code-link: true
    toc: true
    toc-depth: 3
    number-sections: false
    html-math-method: katex
    fig-cap-location: bottom
    tbl-cap-location: top
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: auto
